<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f2f2f2;
        }

        .container {
             width: 100%;
             height: 100%;
            padding: 20px;
            background-color: aqua;
            border-radius: 8px;
        }

        .container h2 {
            text-align: center;
            text-transform: capitalize;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .input-box {
            margin: 12px 0;
        }

        label {
            font-size: 18px;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #333;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            font-size: 17px;
            font-weight: 500;
            padding: 10px;
            border-radius: 5px;
            border: none;
            background-color: #F0F1F8;
        }

        .input-box input[type="radio"] {
            margin-right: 5px;
            margin-top: 8px;
        }

        .contact {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .btn1,
        .btn2,
        .btn3 {
            padding: 8px 12px;
            background-color: #16ff00;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn1:hover,
        .btn2:hover,
        .btn3:hover {
            font-size: 20px;
            color: black;
            box-shadow: 0 0 25px #16ff00;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Student Registration</h2>
        <form id="studentForm">
            <div class="input-box">
                <label for="name">Name:</label>
                <input type="text" id="name" placeholder="Enter Name" required>
            </div>

            <div class="input-box">
                <label for="roll">Roll No:</label>
                <input type="number" id="roll" placeholder="Enter Roll No" required>
            </div>

            <div class="input-box">
                <label for="address">Address:</label>
                <input type="text" id="address" placeholder="Enter Your Address" required>
            </div>

            <!-- ✅ Gender Field Added Here -->
            <div class="input-box">
                <label>Gender:</label>
                <input type="radio" id="male" name="gender" value="Male">
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="Female">
                <label for="female">Female</label>
            </div>

            <div class="input-box">
                <label for="class">Class:</label>
                <input type="number" id="class" placeholder="Enter Class" required>
            </div>

            <div class="input-box">
                <label for="parents">Parent's Name:</label>
                <input type="text" id="parents" placeholder="Enter Parent's Name" required>
            </div>

            <div class="contact">
                <button type="button" class="btn1" id="clearBtn">Clear</button>
                <button type="submit" class="btn2" id="registerBtn">Register</button>
                <button type="button" class="btn3" id="contactBtn">Contact</button>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById("studentForm");

        const name = document.getElementById("name");
        const roll = document.getElementById("roll");
        const address = document.getElementById("address");
        const studentClass = document.getElementById("class");
        const parents = document.getElementById("parents");
        const genderRadios = document.getElementsByName("gender");

        const clearBtn = document.getElementById("clearBtn");
        const contactBtn = document.getElementById("contactBtn");

        // Clear Button - Clear Fields & Show Alert
        clearBtn.addEventListener("click", () => {
            name.value = "";
            roll.value = "";
            address.value = "";
            studentClass.value = "";
            parents.value = "";
            genderRadios.forEach(radio => radio.checked = false);
            alert("Form cleared successfully!");
        });

        // Register Button - Submit and Show Alert
        form.addEventListener("submit", (e) => {
            e.preventDefault(); // prevent page reload
            alert("Thank you for registering!");
        });

        // Contact Button - Show Alert
        contactBtn.addEventListener("click", () => {
            alert("Successfully contacted!");
        });

        form.addEventListener("submit", (e) => {
            e.preventDefault(); // prevent page reload

            let gender = "";
            genderRadios.forEach(radio => {
                if (radio.checked) {
                    gender = radio.value;
                }
            });

            // All input values
            const userData = `
            Thank you for registering!

           Name: ${name.value}
           Roll No: ${roll.value}
           Address: ${address.value}
           Gender: ${gender || "Not selected"}
           Class: ${studentClass.value}
           Parent's Name: ${parents.value}
  `;

            alert(userData);
        });

    </script>
</body>

</html>
