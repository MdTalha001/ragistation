<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <div class="container mt-5">
  <div class="row">
    <div class="col-md-7">
      <table class="table table-dark table-bordered table-hover">
        <thead>
          <tr>
          
            <td>Name</td>
            <td>Address</td>
            <td>Phone</td>
            <td>Actions</td>
          </tr>
        </thead>
       
      </table>
    </div>
    <div class="col-md-5">
      <div class="card-body">
        <form action="/add" method="POST">
          <input
            type="text"
            name="name"
            placeholder="Name"
            class="form-control mb-2"
            autofocus
          />
          <input
            type="email"
            name="address"
            placeholder="Address"
            class="form-control mb-2"
          />
          <input
            type="text"
            name="phone"
            placeholder="Phone"
            class="form-control mb-2"
          />

          <button type="submit" class="btn btn-info">save customer</button>
        </form>
      </div>
    </div>
  </div>
</div>

</div>
</body>
</html>
