<!-- public/form.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form</title>
</head>
<body>
  <h1>Login</h1>
  <form action="/submit" method="POST">
    <div class="input-box">
                <label for="name">Name:</label>
                <input type="text" id="name" placeholder="Enter Name" name="name" required>
            </div>
            <div class="input-box">
                <label for="roll">Roll No:</label>
                <input type="number" id="roll" placeholder="Enter Roll No" required name="Roll">
            </div>

            <div class="input-box">
                <label for="address">Address:</label>
                <input type="text" id="address" placeholder="Enter Your Address" required name="address">
            </div>
            <div class="input-box">
                <label>Gender:</label>
                <div class="gender">
                    <label for="male">Male</label>
                    <input type="radio" id="male" name="gender" value="Male" name="Gender">
                    <label for="female">Female</label>
                    <input type="radio" id="female" name="gender" value="Female" name="Gender">
                </div>
            </div>

            <div class="input-box">
                <label for="class">Class:</label>
                <input type="number" id="class" placeholder="Enter Class" required name="section">
            </div>

            <div class="input-box">
                <label for="parents">Parent's Name:</label>
                <input type="text" id="parents" placeholder="Enter Parent's Name" required name="Parents">
            </div>
            <button type="submit" class="btn2" id="registerBtn">Register</button>  
  </form>
   <a href="users"><button>View Users</button></a>
</body>
</html>
