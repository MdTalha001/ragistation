<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>Student Registration</title>
    <style>
       
    </style>
</head>

<body>
    
    <div class="container">
        <h2>Student Registration</h2>
         <form action="/register" method="POST">
            <div class="input-box">
                <label for="name">Name:</label>
                <input type="text" id="name" placeholder="Enter Name" name="name" required>
            </div>
            <div class="input-box">
                <label for="roll">Roll No:</label>
                <input type="number" id="roll" placeholder="Enter Roll No" required name="Roll">
            </div>

            <div class="input-box">
                <label for="address">Address:</label>
                <input type="text" id="address" placeholder="Enter Your Address" required name="address">
            </div>
            <div class="input-box">
                <label>Gender:</label>
                <div class="gender">
                    <label for="male">Male</label>
                    <input type="radio" id="male" name="gender" value="Male" name="Gender">
                    <label for="female">Female</label>
                    <input type="radio" id="female" name="gender" value="Female" name="Gender">
                </div>
            </div>

            <!-- <div class="input-box">
                <label for="class">Class:</label>
                <input type="number" id="class" placeholder="Enter Class" required name="section">
            </div> -->

            <div class="input-box">
                <label for="parents">Parent's Name:</label>
                <input type="text" id="parents" placeholder="Enter Parent's Name" required name="Parents">
            </div>
            <div class="input-box">
                <label for="parents">Password:</label>
                <input type="text" id="password" placeholder="Enter Password" required name="password">
            </div>
            <div class="input-box">
                <label for="parents">Confirm Password:</label>
                <input type="text" id="confirm" placeholder="confirm password" required name="confirm">
            </div>
            <button type="submit" class="btn2" id="registerBtn">Register</button>         
        </form>
    </div>

    
</body>

</html>
